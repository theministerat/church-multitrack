<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#111317" />
    <title>Church Multitrack</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">Church Multitrack</div>
      <div class="transport">
        <button id="play" class="btn play" aria-label="Play">▶ Play</button>
        <button id="stop" class="btn stop" aria-label="Stop">■ Stop</button>
      </div>
      <div class="master">
        <label for="master">Master</label>
        <input id="master" type="range" min="0" max="1" step="0.01" />
      </div>
      <div class="conn" id="conn" title="Connection">●</div>
    </header>

    <main class="layout">
      <aside class="songs">
        <div class="section-title">
          Songs
          <button id="rescan" class="link" title="Look for new songs">Refresh</button>
        </div>
        <ul id="song-list"></ul>
        <div id="empty-library" class="empty" hidden>
          <p>No songs yet.</p>
          <p>
            Make a folder for each song inside the Songs folder and put its WAV loops in it, then
            press Refresh.
          </p>
          <button id="open-folder" class="btn small host-only">Open Songs folder</button>
        </div>
      </aside>

      <section class="mixer">
        <div class="now">
          <div>
            <div class="section-title">Now playing</div>
            <h1 id="song-title">—</h1>
          </div>
          <div class="status" id="status"></div>
        </div>
        <div id="layers" class="layers"></div>
      </section>
    </main>

    <footer class="footer">
      <span class="host-only" id="remote-info"></span>
      <span class="remote-only">Remote control. Audio plays from the PC.</span>
      <label class="fade">
        Fade
        <select id="fade">
          <option value="0">Off</option>
          <option value="1">1s</option>
          <option value="2">2s</option>
          <option value="4">4s</option>
          <option value="8">8s</option>
        </select>
      </label>
    </footer>

    <div id="start-audio" class="overlay" hidden>
      <button class="btn play big">Tap to enable audio</button>
    </div>

    <script type="module" src="app.js"></script>
  </body>
</html>
